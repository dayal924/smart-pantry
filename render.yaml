services:
  # ============================================================================
  # FastAPI Backend Web Service (Render Free Tier)
  # ============================================================================
  - type: web
    name: smart-pantry-api
    runtime: python
    rootDir: backend
    plan: free
    region: oregon
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: MONGODB_URI
        sync: false # Set in Render Dashboard: your MongoDB Atlas connection string
      - key: MONGODB_DB
        value: smart_pantry
      - key: JWT_SECRET
        generateValue: true # Render will automatically generate a secure random secret
      - key: CORS_ORIGINS
        value: "*"
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false # Optional: free key from console.groq.com
      - key: GEMINI_API_KEY
        sync: false # Optional: free key from aistudio.google.com
