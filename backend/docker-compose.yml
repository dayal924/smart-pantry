services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes: [mongo_data:/data/db]
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongo:27017
    ports: ["8000:8000"]
    volumes: ["./storage:/srv/storage"]
    depends_on: [mongo]
volumes:
  mongo_data:
